<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Venex CRM</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1ec;--sf:#fff;--ink:#17262b;--mu:#5e6e73;--ln:#d9dfda;--ok:#1f7a5a;--okt:#dcebe4;--hu:#c97a12;--hut:#fff3de}
@media(prefers-color-scheme:dark){:root{--bg:#10191c;--sf:#182429;--ink:#e8eeec;--mu:#92a3a8;--ln:#2a3a40;--ok:#4cc79a;--okt:#1e3a31;--hu:#f0a640;--hut:#3a2c14}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
.app{display:grid;grid-template-columns:360px 1fr;height:100%}
.side{background:var(--sf);border-inline-end:1px solid var(--ln);display:flex;flex-direction:column;min-height:0}
.top{padding:14px 14px 8px}.top h1{font-size:18px;margin:0 0 10px;font-weight:600}
.top input{width:100%;padding:9px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--bg)}
.tabs{display:flex;gap:6px;margin-top:10px}
.tabs button{flex:1;padding:6px 4px;border:1px solid var(--ln);background:none;border-radius:8px;font-size:13px}
.tabs button.on{background:var(--ink);color:var(--sf);border-color:var(--ink)}
.list{overflow:auto;flex:1}
.it{display:flex;gap:10px;padding:12px 14px;border:0;border-bottom:1px solid var(--ln);background:none;width:100%;text-align:start}
.it.on{background:var(--bg)}
.av{width:38px;height:38px;border-radius:50%;background:var(--okt);color:var(--ok);display:grid;place-items:center;font-weight:600;flex:none}
.it.p .av{background:var(--hut);color:var(--hu)}
.bd{min-width:0;flex:1}.r1{display:flex;justify-content:space-between;gap:8px}.nm{font-weight:600}
.tm{color:var(--mu);font-size:12px;white-space:nowrap}.ls{color:var(--mu);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main{display:flex;flex-direction:column;min-height:0;min-width:0}
.main.p{background:var(--hut)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;background:var(--sf);border-bottom:1px solid var(--ln);flex-wrap:wrap}
.hd h2{margin:0;font-size:17px}.back{display:none;border:0;background:none;font-size:20px}
.sw{display:flex;border:1px solid var(--ln);border-radius:10px;overflow:hidden}
.sw button{border:0;background:none;padding:9px 16px;font-weight:500}
.sw .b.on{background:var(--ok);color:#fff}.sw .h.on{background:var(--hu);color:#fff}
.msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:8px}
.bn{background:var(--sf);border:1px solid var(--hu);color:var(--ink);padding:8px 12px;border-radius:8px;font-size:13px;align-self:center}
.m{max-width:min(520px,80%);padding:9px 12px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
.m.customer{background:var(--sf);border:1px solid var(--ln);align-self:flex-start}
.m.bot{background:var(--okt);align-self:flex-end}
.m.me{background:var(--ink);color:var(--sf);align-self:flex-end}
.m small{display:block;opacity:.65;font-size:11px;margin-bottom:2px}
.m img{display:block;max-width:180px;border-radius:8px;margin-top:6px}
.cmp{display:flex;gap:10px;padding:12px 18px;background:var(--sf);border-top:1px solid var(--ln)}
.cmp textarea{flex:1;resize:none;height:46px;padding:10px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--bg)}
.send{padding:0 20px;border:0;border-radius:8px;background:var(--ink);color:var(--sf);font-weight:600}
.send:disabled{opacity:.5}
.emp{margin:auto;color:var(--mu);text-align:center;padding:24px}
.toast{position:fixed;inset-block-end:16px;inset-inline-start:16px;background:var(--ink);color:var(--sf);padding:10px 14px;border-radius:8px;display:none;max-width:90%}
.login{max-width:380px;margin:12vh auto;background:var(--sf);padding:24px;border-radius:12px;border:1px solid var(--ln)}
.login label{display:block;margin:12px 0 4px;font-size:13px;color:var(--mu)}
.login input{width:100%;padding:10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg)}
.login button{margin-top:16px;width:100%;padding:11px;border:0;border-radius:8px;background:var(--ok);color:#fff;font-weight:600}
.err{color:#c0392b;font-size:13px;margin-top:10px}
@media(max-width:820px){.app{grid-template-columns:1fr}.main{display:none}.app.open .side{display:none}.app.open .main{display:flex}.back{display:block}}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<script>
const DEF_URL='https://primary-production-8e4d1.up.railway.app/webhook/venex-crm-api';
let cfg=JSON.parse(localStorage.getItem('venexCrm')||'null');
let S={chats:[],sel:null,filter:'all',q:'',hist:[],mine:{},busy:false};
const $=id=>document.getElementById(id);
function h(t,a,...k){const e=document.createElement(t);for(const[x,v]of Object.entries(a||{})){if(x==='class')e.className=v;else if(x.startsWith('on'))e[x]=v;else e.setAttribute(x,v)}k.flat().forEach(c=>e.append(c instanceof Node?c:document.createTextNode(c??'')));return e}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3500)}
async function api(action,p={}){
  const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:cfg.key,action,...p})});
  if(r.status===401){localStorage.removeItem('venexCrm');cfg=null;login('المفتاح غير صحيح');throw new Error('401')}
  const j=await r.json();if(!j.ok)throw new Error(j.error||'خطأ');return j}
function ago(t){if(!t)return'';const m=Math.max(0,Math.round((Date.now()-new Date(t))/6e4));if(m<1)return'الآن';if(m<60)return m+' د';const x=Math.round(m/60);return x<48?x+' س':Math.round(x/24)+' ي'}
function login(err){
  const u=h('input',{value:cfg?.url||DEF_URL,dir:'ltr'}),k=h('input',{type:'password',dir:'ltr'});
  const go=()=>{cfg={url:u.value.trim(),key:k.value.trim()};localStorage.setItem('venexCrm',JSON.stringify(cfg));start()};
  $('root').replaceChildren(h('div',{class:'login'},h('h1',{},'Venex CRM'),h('label',{},'رابط الـ API'),u,h('label',{},'المفتاح السري'),k,h('button',{onclick:go},'دخول'),err?h('div',{class:'err'},err):''));
}
function visible(){return S.chats.filter(c=>(S.filter==='all'||(S.filter==='paused')===c.paused)&&(c.name+c.last_message).toLowerCase().includes(S.q.toLowerCase()))}
function draw(){
  const sel=S.chats.find(c=>c.user_id===S.sel),np=S.chats.filter(c=>c.paused).length;
  const search=h('input',{placeholder:'بحث بالاسم أو الرسالة',value:S.q,oninput:e=>{S.q=e.target.value;drawList()}});
  const tabs=h('div',{class:'tabs'},...[['all','الكل'],['paused','تدخل بشري ('+np+')'],['active','البوت شغال']].map(([v,l])=>h('button',{class:S.filter===v?'on':'',onclick:()=>{S.filter=v;draw()}},l)));
  const list=h('div',{class:'list',id:'list'});
  const side=h('div',{class:'side'},h('div',{class:'top'},h('h1',{},'المحادثات ',h('button',{title:'إعدادات الاتصال','aria-label':'إعدادات الاتصال',onclick:()=>login(),style:'border:0;background:none;font-size:16px;padding:0 6px'},'⚙')),search,tabs),list);
  $('root').replaceChildren(h('div',{class:'app'+(sel?' open':'')},side,thread(sel)));drawList();
  const m=$('msgs');if(m)m.scrollTop=m.scrollHeight}
function drawList(){const l=$('list');if(!l)return;const v=visible();
  l.replaceChildren(...(v.length?v.map(c=>h('button',{class:'it'+(c.paused?' p':'')+(c.user_id===S.sel?' on':''),onclick:()=>pick(c.user_id)},h('div',{class:'av'},(c.name||'؟')[0]),h('div',{class:'bd'},h('div',{class:'r1'},h('span',{class:'nm'},c.name),h('span',{class:'tm'},(c.paused?'🟠 ':'')+ago(c.updated_at))),h('div',{class:'ls'},c.last_message||'—')))):[h('div',{class:'emp'},'مفيش محادثات هنا لسه.')]))}
function thread(c){
  if(!c)return h('div',{class:'main'},h('div',{class:'emp'},'اختار عميل من القائمة عشان تشوف المحادثة وتتحكم في البوت.'));
  const ta=h('textarea',{placeholder:'اكتب ردك… (Ctrl+Enter للإرسال)',onkeydown:e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))send(ta)}});
  const btn=h('button',{class:'send',id:'sendBtn',onclick:()=>send(ta)},'إرسال');
  const items=[...S.hist.map(m=>h('div',{class:'m '+m.from},...bubble(m))),...(S.mine[c.user_id]||[]).map(t=>h('div',{class:'m me'},h('small',{},'أنت'),t))];
  return h('div',{class:'main'+(c.paused?' p':'')},
    h('div',{class:'hd'},h('div',{style:'display:flex;gap:8px;align-items:center'},h('button',{class:'back',onclick:()=>{S.sel=null;draw()}},'→'),h('h2',{},c.name)),
      h('div',{class:'sw'},h('button',{class:'b'+(c.paused?'':' on'),onclick:()=>mode(c,'resume')},'البوت شغال'),h('button',{class:'h'+(c.paused?' on':''),onclick:()=>mode(c,'pause')},'تدخّل بشري'))),
    h('div',{class:'msgs',id:'msgs'},c.paused?h('div',{class:'bn'},'البوت متوقف مع العميل ده. رد من هنا أو من صفحة فيسبوك.'):'',...items,items.length?'':h('div',{class:'emp'},'مفيش سجل محادثة محفوظ للعميل ده.')),
    h('div',{class:'cmp'},ta,btn))}
function bubble(m){const out=[],re=/\[\[IMG:(https:\/\/[^\]\s]+)\]\]/g;const t=m.text.replace(re,(x,u)=>{out.push(h('img',{src:u,alt:'صورة منتج'}));return''}).trim();
  return[h('small',{},m.from==='customer'?'العميل':'البوت'),t,...out]}
async function pick(id){S.sel=id;S.hist=[];draw();try{S.hist=(await api('history',{user_id:id})).messages}catch(e){toast('تعذر تحميل المحادثة')}if(S.sel===id)draw()}
async function mode(c,m){try{await api('set_mode',{user_id:c.user_id,mode:m});c.paused=m==='pause';toast(c.paused?'تم إيقاف البوت لهذا العميل':'تم تشغيل البوت لهذا العميل');draw()}catch(e){toast('فشل التغيير: '+e.message)}}
async function send(ta){const t=ta.value.trim(),c=S.chats.find(x=>x.user_id===S.sel);if(!t||!c)return;$('sendBtn').disabled=true;
  try{await api('send',{user_id:c.user_id,text:t});(S.mine[c.user_id]=S.mine[c.user_id]||[]).push(t);c.paused=true;toast('تم الإرسال، والبوت متوقف مع العميل');draw()}
  catch(e){toast('فشل الإرسال: '+e.message);$('sendBtn').disabled=false}}
async function load(){if(S.busy||!cfg)return;S.busy=true;try{S.chats=(await api('list')).chats;if(document.activeElement?.tagName!=='TEXTAREA'&&document.activeElement?.tagName!=='INPUT')draw();else drawList()}catch(e){if(e.message!=='401')toast('تعذر الاتصال بالـ API')}S.busy=false}
function start(){draw();load()}
cfg?start():login();setInterval(load,20000);
</script>
</body>
</html>
